<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrickCraft</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0b0b;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Główny kontener centrujący całość na środku ekranu */
        .page-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 1200px;
            padding: 15px;
            height: 100%;
            justify-content: center;
        }

        /* Stylowy, duży nagłówek tuż nad obrazkiem */
        .brand-title {
            color: #ffffff;
            font-size: 3.2rem;
            font-weight: 900;
            letter-spacing: 4px;
            text-transform: uppercase;
            text-align: center;
            margin-bottom: 12px;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.8), 0 0 25px rgba(255, 255, 255, 0.2);
            background: linear-gradient(180deg, #ffffff 20%, #d0d0d0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Kontener na obrazek i stopkę */
        .hero-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9; /* Zachowuje idealne proporcje obrazka */
            max-height: 75vh;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
        }

        /* Obrazek w tle */
        .hero-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover; /* Na komputerze wypełnia całe okno grafiki */
            object-position: center;
            z-index: 1;
        }

        /* Przyciemnienie dla czytelności stopki */
        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to top, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0.1) 50%, rgba(0,0,0,0.1) 100%);
            z-index: 2;
        }

        /* Stopka tekstowa na dole obrazka */
        .footer-text {
            position: relative;
            z-index: 3;
            color: #ffffff;
            background-color: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(5px);
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 1rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-weight: bold;
            text-align: center;
            max-width: 90%;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        /* Dopasowanie do telefonów */
        @media (max-width: 768px) {
            .page-wrapper {
                padding: 10px;
                justify-content: center;
            }

            .brand-title {
                font-size: 2rem;
                letter-spacing: 2px;
                margin-bottom: 8px;
            }

            .hero-container {
                aspect-ratio: auto;
                height: auto;
                max-height: none;
            }

            .hero-bg {
                position: relative;
                width: 100%;
                height: auto;
                object-fit: contain; /* Na telefonie obrazek wyświetla się w całości, nic nie ucinając */
                border-radius: 8px;
            }

            .footer-text {
                font-size: 0.8rem;
                padding: 8px 12px;
                margin-bottom: 10px;
            }
        }
    </style>
</head>
<body>

    <div class="page-wrapper">
        <!-- Duży nagłówek tuż nad obrazkiem -->
        <h1 class="brand-title">BrickCraft</h1>

        <div class="hero-container">
            <!-- Obrazek w tle -->
            <img src="napisbrick.jpg" alt="BrickCraft" class="hero-bg">
            <div class="hero-overlay"></div>
            
            <!-- Stopka tekstowa na dole -->
            <div class="footer-text">Beyond the bricks. 
                We are building for you. 
                Be patient</div>
        </div>
    </div>

</body>
</html>
