<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrickCraft</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background-color: #000;
        }

        .hero-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            width: 100dvh; /* Obsługa pełnego ekranu na mobile */
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
        }

        /* Kluczowa zmiana: użycie tagu <img> zamiast background-image, 
           dzięki czemu przeglądarka na telefonie idealnie skaluje cały obrazek */
        .hero-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover; /* Dopasowuje obraz do ekranu bez deformacji */
            object-position: center;
            z-index: 1;
        }

        /* Delikatne przyciemnienie, żeby napis na dole był zawsze czytelny na telefonie */
        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0.1) 50%, rgba(0,0,0,0.2) 100%);
            z-index: 2;
        }

        .footer-text {
            position: relative;
            z-index: 3;
            color: #ffffff;
            background-color: rgba(0, 0, 0, 0.75);
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 1.1rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-weight: bold;
            text-align: center;
            margin-bottom: 30px;
            max-width: 90%;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        /* Automatyczne pomniejszenie napisu na mniejszych ekranach telefonów */
        @media (max-width: 768px) {
            .footer-text {
                font-size: 0.85rem;
                padding: 10px 14px;
                margin-bottom: 20px;
                letter-spacing: 0.5px;
            }
        }
    </style>
</head>
<body>

    <div class="hero-container">
        <!-- Obrazek w tle dopasowujący się automatycznie do komputera i telefonu -->
        <img src="napisbrick.jpg" alt="BrickCraft" class="hero-bg">
        <div class="hero-overlay"></div>
        
        <!-- Stopka tekstowa na dole -->
        <div class="footer-text">beyond the bricks we are building for you. be patient</div>
    </div>

</body>
</html>
