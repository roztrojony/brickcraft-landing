<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrickCraft</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #000;
        }

        .hero-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            height: 100dvh; /* Obsługa pełnego ekranu na mobile */
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 30px 20px;
            text-align: center;
        }

        /* Obrazek w tle */
        .hero-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover; /* Na komputerze wypełnia cały ekran */
            object-position: center;
            z-index: 1;
        }

        /* Delikatne przyciemnienie, żeby napisy były czytelne */
        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.5) 0%, rgba(0,0,0,0.1) 40%, rgba(0,0,0,0.7) 100%);
            z-index: 2;
        }

        .content-top, .content-bottom {
            position: relative;
            z-index: 3;
        }

        /* Duży, stylowy nagłówek BRICKCRAFT */
        .brand-title {
            color: #ffffff;
            font-size: 4rem;
            font-weight: 900;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.9), 0 0 25px rgba(255, 255, 255, 0.25);
            margin-top: 10px;
        }

        /* Stopka tekstowa na dole */
        .footer-text {
            color: #ffffff;
            background-color: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(5px);
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 1.1rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-weight: bold;
            text-align: center;
            margin-bottom: 10px;
            max-width: 90%;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        /* Automatyczne dopasowanie na telefonach */
        @media (max-width: 768px) {
            .hero-bg {
                object-fit: contain; /* Na telefonie obrazek pomniejsza się, żeby zmieścił się w całości */
            }

            .brand-title {
                font-size: 2.2rem;
                letter-spacing: 1.5px;
            }

            .footer-text {
                font-size: 0.85rem;
                padding: 10px 14px;
                margin-bottom: 15px;
                letter-spacing: 0.5px;
            }
        }
    </style>
</head>
<body>

    <div class="hero-container">
        <!-- Obrazek w tle -->
        <img src="napisbrick.jpg" alt="BrickCraft" class="hero-bg">
        <div class="hero-overlay"></div>
        
        <!-- Górna sekcja z dużym napisem -->
        <div class="content-top">
            <h1 class="brand-title">BrickCraft</h1>
        </div>

        <!-- Dolna sekcja ze stopką -->
        <div class="content-bottom">
            <div class="footer-text">Beyond the bricks. We are building for you. be patient</div>
        </div>
    </div>

</body>
</html>
