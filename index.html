<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrickCraft: Beyond the Bricks</title>
    <style>
        :root {
            --dark-slate: #0f172a;
            --cyan: #38bdf8;
            --off-white: #f8fafc;
            --cyan-glow: rgba(56, 189, 248, 0.5);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--dark-slate);
            color: var(--off-white);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 2rem;
            max-width: 800px;
        }

        h1 {
            font-size: 4rem;
            margin-bottom: 1rem;
            color: var(--cyan);
            text-shadow: 0 0 20px var(--cyan-glow);
        }

        p {
            font-size: 1.5rem;
            margin-bottom: 2rem;
            color: var(--off-white);
        }

        .cta-text {
            font-size: 1.2rem;
            color: #94a3b8;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>BrickCraft: Beyond the Bricks</h1>
        <p>Gdzie inżynieria spotyka sztukę tworzenia. Rozbudź swoją kreatywność.</p>
        <p class="cta-text">Czekaj na dalsze informacje. We are building for you.</p>
    </div>

</body>
</html>
