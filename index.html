<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrickCraft</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
        }

        .hero-background {
            background-image: url('napisbrick.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding: 20px;
        }

        .footer-text {
            color: #ffffff;
            background-color: rgba(0, 0, 0, 0.75);
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1.2rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-weight: bold;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            max-width: 90%;
        }

        /* Reguły dla urządzeń mobilnych (ekrany o szerokości do 768px) */
        @media (max-width: 768px) {
            .hero-background {
                /* Na telefonach pokaże cały obrazek na szerokość bez zniekształceń */
                background-size: contain; 
            }

            .footer-text {
                font-size: 0.95rem; /* Dopasowany rozmiarem czytelny napis na małe ekrany */
                padding: 10px 16px;
                margin-bottom: 10px;
            }
        }
    </style>
</head>
<body>

    <div class="hero-background">
        <div class="footer-text">beyond the bricks we are building for you. be patient</div>
    </div>

</body>
</html>
